<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>绝对值练习（第 3、4 题）· A4 整理版</title>
<style>
:root{--ink:#1a1a1a;--muted:#8a9199;--line:#2b2f33;--accent:#1f4e79;}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#565a5e;font-family:"Times New Roman","Noto Serif SC","SimSun","Songti SC",serif;color:var(--ink)}
/* ---------- A4 页面 ---------- */
.page{
 width:210mm;min-height:297mm;margin:24px auto;background:#fff;
 padding:16mm 18mm 14mm;box-shadow:0 4px 22px rgba(0,0,0,.4);
 display:flex;flex-direction:column;position:relative;
}
@media print{
 body{background:#fff}
 .page{width:auto;min-height:auto;margin:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* ---------- 页眉 ---------- */
header{border-bottom:1.6mm solid var(--accent);padding-bottom:4mm;margin-bottom:6mm}
h1{font-family:"SimHei","Noto Sans SC","Microsoft YaHei",sans-serif;font-size:15.5pt;margin:0 0 3mm;letter-spacing:1px;text-align:center}
h1 .tag{font-size:9pt;color:#fff;background:var(--accent);padding:1px 8px;border-radius:3px;letter-spacing:0;vertical-align:2.5px;margin-left:6px;font-weight:400}
.meta{display:flex;justify-content:center;gap:14mm;font-size:11pt}
/* ---------- 题目区 ---------- */
.qs{flex:0 0 auto}
.q{margin:0 0 7mm;line-height:1.9;font-size:12pt;text-align:justify}
.q .no{font-weight:700;margin-right:2mm}
.stem .m{font-family:"Times New Roman",serif;padding:0 .5px}
.q3{display:block;margin:2mm 0}
.center{display:block;text-align:center;margin:1.5mm 0}
/* 分数 */
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.12;margin:0 1.5px}
.frac .num{border-bottom:1px solid currentColor;padding:0 3px .5px}
.frac .den{padding:.5px 3px 0}
/* 填空与括号 */
.blank{display:inline-block;min-width:30mm;border-bottom:1px solid var(--line);vertical-align:-1.5px;height:1em}
.meta .blank{min-width:22mm;height:.9em}
.bk{display:inline-block;min-width:9mm}
/* 选项 */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:4mm 10mm;margin-top:2.5mm;padding-left:9mm;font-size:12pt}
.opt .lab{font-weight:700;margin-right:1.5mm}
/* ---------- 草稿区 ---------- */
.draft{
 flex:1 1 auto;min-height:118mm;margin-top:4mm;
 border:1.1pt dashed #b7bec6;border-radius:6px;position:relative;
}
.draft .lab{position:absolute;top:2mm;left:4mm;font-size:9pt;color:#a8aeb6;letter-spacing:2px;font-family:"SimHei","Microsoft YaHei",sans-serif}
/* ---------- 页脚 ---------- */
footer{display:flex;justify-content:space-between;font-size:9pt;color:var(--muted);margin-top:5mm;border-top:.6pt solid #d5dae0;padding-top:2.5mm}
footer .pn{letter-spacing:1px}
i{font-style:italic;font-family:"Times New Roman",serif;padding:0 .5px}
</style>
</head>
<body>
<div class="page">

 <header>
  <h1>绝对值练习题<span class="tag">A4 文字整理版</span></h1>
  <div class="meta">
   <span>姓名：<span class="blank"></span></span>
   <span>日期：<span class="blank"></span></span>
   <span>用时：<span class="blank"></span></span>
  </div>
 </header>

 <div class="qs">
  <div class="q">
   <span class="no">3.</span><span class="stem">适合
    <span class="m">|1−2<i>a</i>|+|2<i>a</i>+2020|=2021</span>
    的整数 <i>a</i> 有<span class="blank"></span>个。</span>
  </div>

  <div class="q">
   <span class="no">4.</span><span class="stem">设有理数 <i>a</i>，<i>b</i>，<i>c</i> 满足
    <span class="m"><i>a</i>&lt;0&lt;<i>b</i>&lt;<i>c</i></span>，则代数式</span>
   <span class="center m">
    |<i>x</i>−<span class="frac"><span class="num"><i>a</i>+<i>b</i></span><span class="den">3</span></span>|
    +|<i>x</i>−<span class="frac"><span class="num"><i>a</i>+<i>c</i></span><span class="den">2</span></span>|
    +|<i>x</i>+<span class="frac"><span class="num"><i>c</i>−<i>a</i></span><span class="den">2</span></span>|
   </span>
   <span class="q3 stem">的最小值为（<span class="bk"></span>）</span>
   <div class="opts">
    <div class="opt"><span class="lab">A.</span><i>c</i></div>
    <div class="opt"><span class="lab">B.</span><span class="frac"><span class="num">2<i>b</i>−<i>a</i></span><span class="den">3</span></span></div>
    <div class="opt"><span class="lab">C.</span><span class="frac"><span class="num"><i>a</i>+9<i>c</i>−2<i>b</i></span><span class="den">6</span></span></div>
    <div class="opt"><span class="lab">D.</span><span class="frac"><span class="num">3<i>c</i>−2<i>b</i>−11<i>a</i></span><span class="den">6</span></span></div>
   </div>
  </div>
 </div>

 <div class="draft"><span class="lab">草稿区</span></div>

 <footer>
  <span>整理自图片 · 题号沿用原卷 · 共 1 页</span>
  <span class="pn">— 1 —</span>
 </footer>

</div>
</body>
</html>
